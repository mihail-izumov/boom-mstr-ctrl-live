:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
/* ⛔ СГЛАЖИВАНИЕ — НЕ КОСМЕТИКА. Фронт задаёт antialiased на body, и на маке это
   рисует буквы заметно тоньше при том же весе 400. Без этой строки тот же шрифт
   того же кегля выглядит жирнее оригинала — на этом мы потеряли три захода. */
body{margin:0;display:flex;align-items:center;justify-content:center;background:#0a0a0a;color:#f2f2f2;
 -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
 font:17px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;padding:32px 16px}
.об{display:flex;flex-direction:column;align-items:center;width:100%}
.знак{width:94px;height:80px;color:#f2f2f2}
.знак svg{width:100%;height:100%;display:block}
.титул{font-family:"Ranscale Display","Helvetica Neue",Arial,sans-serif;font-size:42px;line-height:42px;
 font-weight:400;letter-spacing:2.52px;margin:18px -2.52px 0 0;text-transform:uppercase;color:#f2f2f2}
.ультра-бокс{display:flex;align-items:center;justify-content:center;border:2px solid #f2f2f2;
 padding:0 12px;height:32px;margin-top:0}
/* «Ультра» — ровно как на фронте: Ranscale Display 400, без обводки и без сдвига.
   Присланный лого-макет набран жирнее живой страницы, подгонять под него нельзя:
   эталон — сайт, а не макет (владелец, 19.09.2026). */
.ультра{font-family:"Ranscale Display","Helvetica Neue",Arial,sans-serif;font-size:21px;line-height:21px;
 font-weight:400;letter-spacing:6.72px;margin-right:-6.72px;text-transform:uppercase;
 position:relative;top:0.06em}
.карта{width:320px;max-width:100%;margin-top:41px;background:#161616;border:1px solid #383838;
 border-radius:20px;padding:24px}
.метка{font-family:"Ranscale Label","Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:23px;
 letter-spacing:1.5px;color:#9a9a9a;text-transform:uppercase;text-align:center;margin-bottom:16px}
.группа{background:#0f0f0f;border:1px solid #2a2a2a;border-radius:12px;overflow:hidden}
.поле{display:flex;align-items:center;height:52px;padding:0 4px 0 16px}
.поле+.поле{border-top:1px solid #2a2a2a;height:53px}
.поле input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:#f2f2f2;
 font-family:"Ranscale Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;padding:0}
.поле input::placeholder{color:#6a6a6a}
.поле.логин input{color:#9a9a9a}
.глаз{background:none;border:0;padding:0 12px;cursor:pointer;color:#8a8a8a;line-height:0}
.глаз svg{width:20px;height:20px;display:block}
.старт{width:100%;height:52px;margin-top:16px;border:0;border-radius:12px;background:#f2f2f2;color:#0a0a0a;
 font-family:"Ranscale Display","Helvetica Neue",Arial,sans-serif;font-size:18px;font-weight:400;
 letter-spacing:2.16px;text-transform:uppercase;cursor:pointer;padding:2px 16px 0}
.старт:disabled{opacity:.45;cursor:default}
.ош{margin-top:18px;font-size:14px;color:#ff8d8d;text-align:center;min-height:0}
.ош:empty,.сноска:empty{margin-top:0}
.сноска{margin-top:18px;font-size:14px;color:#9a9a9a;text-align:center}
